[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beatnothing"
version = "0.1.0"
description = "Can your model beat doing nothing, after costs, without knowing the future? A benchmark harness for daily equity signals."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kaustubh Patil" }]
dependencies = ["numpy>=1.24", "pandas>=2.0", "pyarrow>=14", "scipy>=1.10"]

[project.optional-dependencies]
data = ["yfinance>=0.2"]
figures = ["matplotlib>=3.7"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["beatnothing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
