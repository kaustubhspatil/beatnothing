name: submissions
# check submissions: structure, engine rules, leakage smell test on IC
on:
  pull_request:
    paths:
      - "submissions/**"
      - "submissions_pit/**"
  push:
    paths:
      - "submissions/**"
      - "submissions_pit/**"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: validate every submission
        run: python scripts/validate_submissions.py
