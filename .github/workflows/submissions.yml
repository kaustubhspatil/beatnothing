name: submissions
# Every entry on the board is checked by a machine before a human looks: structure, the
# engine's rules, and a leakage smell test on the information coefficient. A pull request
# that touches a submissions folder cannot merge red.
on:
  pull_request:
    paths:
      - "submissions/**"
      - "submissions_pit/**"
  push:
    paths:
      - "submissions/**"
      - "submissions_pit/**"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: validate every submission
        run: python scripts/validate_submissions.py
